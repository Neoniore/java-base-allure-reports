plugins {
    id 'java-library'
    id('io.qameta.allure') version '4.1.0'
}

repositories {
    mavenCentral()
}

allure {
    report {
        version.set("2.44.1")
    }
    adapter { // отвечает за появление папочки build/allure-results
        aspectjWeaver.set(true) //обработка аннотации @Step
        frameworks {
            junit5 { //название фреймворка
                adapterVersion.set("2.35.3") //версия интеграции фреймворка и Allure
            }
        }
    }
}

dependencies {
    testImplementation (
            'org.junit.jupiter:junit-jupiter:6.1.2',
            'com.codeborne:selenide:7.17.0',
            'io.qameta.allure:allure-selenide:2.35.3'
    )
    testRuntimeOnly(
            'org.junit.platform:junit-platform-launcher'
    )
}

tasks.withType(Test) {
    useJUnitPlatform()

    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard_error", "standard_out"
            exceptionFormat "short"
        }
    }
}